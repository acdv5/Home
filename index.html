<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<title>Maison</title>
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --txt:#1d1d1f; --muted:#6e6e73; --accent:#c2410c; }
  body.nuit { --bg:#0a0f1e; --card:#131c33; --txt:#9fb0cc; --muted:#5a6a86; --accent:#e0a561; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--txt);
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
    padding:24px; display:grid; gap:20px;
    grid-template-columns:1.1fr 1fr; grid-template-rows:1fr auto auto;
    transition:background .6s, color .6s;
    -webkit-user-select:none; user-select:none;
  }
  .carte { background:var(--card); border-radius:24px; padding:28px; }
  #horloge { display:flex; flex-direction:column; justify-content:center; }
  #heure { font-size:150px; font-weight:600; line-height:1; letter-spacing:-4px; font-variant-numeric:tabular-nums; }
  #date { font-size:38px; margin-top:12px; text-transform:capitalize; }
  #meteo { display:flex; flex-direction:column; justify-content:space-between; }
  .maintenant { display:flex; align-items:center; gap:20px; }
  .icone { font-size:96px; line-height:1; }
  #temp { font-size:88px; font-weight:600; }
  #ciel { font-size:30px; color:var(--muted); margin-top:4px; }
  .jours { display:flex; gap:16px; margin-top:16px; }
  .jour { flex:1; background:var(--bg); border-radius:16px; padding:12px 8px; font-size:24px; text-align:center; white-space:nowrap; }
  .jour b { display:block; font-size:20px; color:var(--muted); font-weight:500; }
  .jour i { display:block; font-style:normal; font-size:42px; margin:4px 0; }
  #conseil { font-size:28px; color:var(--accent); font-weight:600; margin-top:14px; }
  /* Bandeau actualité (pleine largeur) */
  #actu { grid-column:1 / 3; display:flex; align-items:center; gap:24px; padding:22px 28px; }
  #actu b { flex:0 0 auto; font-size:24px; color:var(--accent); font-weight:600; }
  #actu-txt {
    flex:1; font-size:36px; font-weight:600; line-height:1.15; transition:opacity .4s;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  #bas { grid-column:1 / 3; display:flex; gap:20px; }
  #bas .carte { padding:20px 28px; }
  .ville { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .ville b { display:block; font-size:22px; color:var(--muted); font-weight:500; margin-bottom:6px; }
  .ville-heure { font-size:56px; font-weight:600; line-height:1; letter-spacing:-2px; font-variant-numeric:tabular-nums; }
  .ville-jour { display:block; font-size:22px; color:var(--muted); text-transform:capitalize; margin-top:6px; }
  .bouton-youtube {
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px;
    background:#ff0000; color:#fff; text-decoration:none; font-size:34px; font-weight:600;
    padding:0 44px; border-radius:24px; transition:transform .15s, filter .15s;
  }
  .bouton-youtube:active { transform:scale(.96); }
  .bouton-youtube .yt-play {
    display:inline-flex; align-items:center; justify-content:center;
    width:60px; height:44px; background:#fff; color:#ff0000; border-radius:12px; font-size:24px; padding-left:4px;
  }
  body.nuit .bouton-youtube { filter:brightness(.55); }
  .erreur { color:var(--muted); font-size:24px; }
  /* Écran plus petit / portrait */
  @media (max-width:900px), (orientation:portrait) {
    body { grid-template-columns:1fr; grid-template-rows:auto auto auto auto; }
    #actu, #bas { grid-column:1; }
    #bas { flex-direction:column; }
    #heure { font-size:120px; }
  }
</style>
</head>
<body>

<section class="carte" id="horloge">
  <div id="heure">--:--</div>
  <div id="date"></div>
</section>

<section class="carte" id="meteo">
  <div>
    <div class="maintenant">
      <div class="icone" id="icone">·</div>
      <div>
        <div id="temp">--°</div>
        <div id="ciel">Chargement…</div>
      </div>
    </div>
    <div id="conseil"></div>
  </div>
  <div class="jours" id="jours"></div>
</section>

<section class="carte" id="actu">
  <b>📰 Actualité</b>
  <div id="actu-txt">Chargement…</div>
</section>

<section id="bas">
  <div class="carte ville" id="tokyo">
    <b>🗼 Tokyo</b>
    <span class="ville-heure" id="tokyo-heure">--:--</span>
    <span class="ville-jour" id="tokyo-jour"></span>
  </div>
  <div class="carte ville" id="sf">
    <b>🌉 San Francisco</b>
    <span class="ville-heure" id="sf-heure">--:--</span>
    <span class="ville-jour" id="sf-jour"></span>
  </div>
  <a class="bouton-youtube" id="youtube" href="https://www.youtube.com/">
    <span class="yt-play">▶</span>
    <span>YouTube</span>
  </a>
</section>

<script>
/* ====================== CONFIGURATION ====================== */
var CONFIG = {
  ville: "Paris",
  latitude: 48.8566,
  longitude: 2.3522,
  nuitDebut: 19,   // heure à partir de laquelle l'écran passe en mode nuit
  nuitFin: 7
};
/* =========================================================== */

var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function deux(n) { return n < 10 ? "0" + n : "" + n; }

/* ---------- Horloge locale, mode nuit ---------- */
function majHorloge() {
  var d = new Date();
  document.getElementById("heure").textContent = deux(d.getHours()) + ":" + deux(d.getMinutes());
  document.getElementById("date").textContent =
    JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();

  var h = d.getHours();
  var nuit = CONFIG.nuitDebut > CONFIG.nuitFin ? (h >= CONFIG.nuitDebut || h < CONFIG.nuitFin)
                                               : (h >= CONFIG.nuitDebut && h < CONFIG.nuitFin);
  document.body.classList.toggle("nuit", nuit);
}

/* ---------- Horloges du monde (Tokyo, San Francisco) ---------- */
function majVille(tz, idHeure, idJour) {
  var parts = new Intl.DateTimeFormat("fr-FR", {
    timeZone: tz, weekday: "long", hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(new Date());
  var m = {};
  parts.forEach(function (p) { m[p.type] = p.value; });
  document.getElementById(idHeure).textContent = m.hour + ":" + m.minute;
  document.getElementById(idJour).textContent = m.weekday;
}
function majVilles() {
  majVille("Asia/Tokyo", "tokyo-heure", "tokyo-jour");
  majVille("America/Los_Angeles", "sf-heure", "sf-jour");
}

/* ---------- Actualité (France Info, RSS, CORS OK) ---------- */
var ACTU = [];        // titres chargés depuis le flux
var actuIdx = 0;

function majActu() {
  fetch("https://www.franceinfo.fr/titres.rss")
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      var doc = new DOMParser().parseFromString(txt, "application/xml");
      var titres = [];
      var items = doc.querySelectorAll("item > title");
      for (var i = 0; i < items.length && titres.length < 6; i++) {
        var t = items[i].textContent.trim();
        if (t) titres.push(t);
      }
      if (titres.length) {
        var premier = !ACTU.length;      // premier chargement réussi ?
        ACTU = titres;                   // on ne remplace que si on a bien reçu des titres
        if (premier) rotationActu();     // affiche un titre tout de suite, sans attendre les 12 s
      }
    })
    .catch(function () {
      if (!ACTU.length) document.getElementById("actu-txt").innerHTML =
        "<span class='erreur'>Actualité indisponible, nouvel essai bientôt</span>";
    });
}

function rotationActu() {
  if (!ACTU.length) return;
  var el = document.getElementById("actu-txt");
  el.style.opacity = 0;                    // fondu sortant
  setTimeout(function () {
    el.textContent = ACTU[actuIdx % ACTU.length];
    actuIdx++;
    el.style.opacity = 1;                  // fondu entrant
  }, 400);
}

/* ---------- Météo (Open-Meteo, sans clé) ---------- */
// Codes météo WMO -> [icône, libellé]
function ciel(code) {
  if (code === 0) return ["☀️", "Ciel dégagé"];
  if (code <= 2) return ["🌤️", "Peu nuageux"];
  if (code === 3) return ["☁️", "Couvert"];
  if (code <= 48) return ["🌫️", "Brouillard"];
  if (code <= 57) return ["🌦️", "Bruine"];
  if (code <= 67) return ["🌧️", "Pluie"];
  if (code <= 77) return ["🌨️", "Neige"];
  if (code <= 82) return ["🌧️", "Averses"];
  if (code <= 86) return ["🌨️", "Averses de neige"];
  return ["⛈️", "Orage"];
}

function majMeteo() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude +
    "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,weather_code" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=Europe%2FParis&forecast_days=3";

  fetch(url).then(function (r) { return r.json(); }).then(function (m) {
    var c = ciel(m.current.weather_code);
    document.getElementById("icone").textContent = c[0];
    document.getElementById("temp").textContent = Math.round(m.current.temperature_2m) + "°";
    document.getElementById("ciel").textContent = c[1] + " à " + CONFIG.ville;

    var j2 = JOURS[(new Date().getDay() + 2) % 7];
    var noms = ["Aujourd'hui", "Demain", j2.charAt(0).toUpperCase() + j2.slice(1)];
    var html = "";
    for (var i = 0; i < 3; i++) {
      var cj = ciel(m.daily.weather_code[i]);
      html += "<div class='jour'><b>" + noms[i] + "</b><i>" + cj[0] + "</i>" +
        Math.round(m.daily.temperature_2m_min[i]) + "° / " + Math.round(m.daily.temperature_2m_max[i]) + "°</div>";
    }
    document.getElementById("jours").innerHTML = html;

    var pluie = m.daily.precipitation_probability_max[0];
    var conseil = "";
    if (pluie >= 50) conseil = "☂️ Prenez un parapluie (" + pluie + " % de risque de pluie)";
    else if (m.daily.temperature_2m_min[0] <= 0) conseil = "🧣 Gel possible ce matin, couvrez-vous";
    else if (m.daily.temperature_2m_max[0] >= 30) conseil = "🥵 Forte chaleur, pensez à boire";
    document.getElementById("conseil").textContent = conseil;
  }).catch(function () {
    document.getElementById("ciel").innerHTML = "<span class='erreur'>Météo indisponible, nouvel essai bientôt</span>";
  });
}

/* ---------- Boucles ---------- */
majHorloge(); majVilles(); majMeteo(); majActu(); rotationActu();
setInterval(majHorloge, 10 * 1000);          // horloge : toutes les 10 s
setInterval(majVilles, 10 * 1000);           // horloges Tokyo / San Francisco : toutes les 10 s
setInterval(majMeteo, 15 * 60 * 1000);       // météo : toutes les 15 min
setInterval(majActu, 15 * 60 * 1000);        // actualité : récupère les titres toutes les 15 min
setInterval(rotationActu, 12 * 1000);        // défilement des titres : toutes les 12 s
setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000); // rechargement complet toutes les 6 h (récupère tes modifs)
</script>
</body>
</html>
